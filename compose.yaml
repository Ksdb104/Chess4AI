services:
  chess4ai:
    build:
      context: .
      dockerfile: Dockerfile
    image: chess4ai:latest
    container_name: chess4ai
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      HOST: 0.0.0.0
      ENGINE_SERVER_PORT: 8787
      MAX_ENGINE_JOBS: 2
    cpus: 2.0
    mem_limit: 1g
    read_only: true
    tmpfs:
      - /tmp