services:
  chess4ai:
    build:
      context: .
      dockerfile: Dockerfile
    image: chess4ai:latest
    restart: unless-stopped
    expose:
      - "8787"
    environment:
      HOST: 0.0.0.0
      ENGINE_SERVER_PORT: 8787
      MAX_ENGINE_JOBS: 2
    cpus: 2.0
    mem_limit: 1g
    read_only: true
    tmpfs:
      - /tmp

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      chess4ai:
        condition: service_healthy
    environment:
      CHESS4AI_DOMAIN: ${CHESS4AI_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile.docker:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config: